version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: admin_dashboard_db
    environment:
      POSTGRES_DB: admin_dashboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: admin_dashboard_backend
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/admin_dashboard?schema=public
      JWT_SECRET: change-this-in-production-to-a-strong-secret
      JWT_EXPIRES_IN: 7d
      PORT: 3001
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: admin_dashboard_frontend
    ports:
      - '80:80'
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
